[project]
name = "localsearch"
version = "0.2.0"
description = "Search inside a folder of files and get a TLDR, using tiny (1-4B) local models via any OpenAI-compatible API."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "rich>=13.0",
    "pypdf>=4.0",
]

[project.scripts]
localsearch = "localsearch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["localsearch*"]
